    <rect x="2" y="103" width="432" height="8" rx="4" fill="url(#accent)"/>
  </g>

  <g transform="translate(86 344)">
    <rect x="0" y="0" width="170" height="44" rx="22" fill="#d7b56d"/>
    <text x="28" y="29" class="sans" font-size="19" font-weight="800" fill="#092238">2025 修订版</text>
    <rect x="186" y="0" width="175" height="44" rx="22" fill="#ffffff" opacity="0.14"/>
    <text x="213" y="29" class="sans" font-size="18" font-weight="650" fill="#fffaf0">XeLaTeX</text>
