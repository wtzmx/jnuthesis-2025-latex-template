    <rect x="54" y="379" width="186" height="9" rx="4.5" fill="#ded8cd"/>
    <text x="180" y="440" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#8d6d2c">root.tex · jnthesis.cls · jn.bst</text>
