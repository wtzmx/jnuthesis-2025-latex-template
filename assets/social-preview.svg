<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="江南大学研究生学位论文 LaTeX 模板 2025 修订版预览图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092238"/>
      <stop offset="0.52" stop-color="#123b4a"/>
      <stop offset="1" stop-color="#efe7d8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2efe8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7b56d"/>
      <stop offset="1" stop-color="#c8473f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#061826" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .serif { font-family: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", serif; }
      .mono { font-family: "SFMono-Regular", "Cascadia Mono", "Menlo", "Consolas", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1025" cy="96" r="220" fill="#f2dca0" opacity="0.18" filter="url(#soft)"/>
  <circle cx="116" cy="560" r="190" fill="#3cb4a6" opacity="0.13" filter="url(#soft)"/>
  <path d="M0 456 C190 402 270 470 443 426 C620 381 719 245 882 268 C1050 292 1117 417 1280 369 L1280 640 L0 640 Z" fill="#fff7e8" opacity="0.08"/>

  <g transform="translate(86 92)">
